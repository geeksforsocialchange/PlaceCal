---
directory:
  "/html/body/header":
    header grid grid-cols-[1fr_auto] items-center print:hidden
    container-public py-6 bg-background border-b border-rules
  "/html/body/header/a":
    header__branding row-start-1 col-start-1  logo:object-contain
    logo:max-w-full logo:max-h-full w-32 h-10 md:w-42 md:h-12
  "/html/body/header/a/svg": ""
  "/html/body/header/a/h1": sr-only
  "/html/body/header/button":
    header__toggle row-start-1 col-start-2 flex gap-2 ms-auto
    me-1.5 items-center text-foreground md:me-4 lg:hidden
  "/html/body/header/button/span": text-base font-semibold header__toggle-label
  "/html/body/header/button/svg": " size-8 fill-secondary"
  "/html/body/header/nav":
    nav header__menu row-start-2 col-start-1 col-span-2 flex
    flex-col justify-evenly is-hidden h-auto overflow-clip transition-[display,height,margin-top,padding-block]
    duration-300 md:flex-row -mx-3 md:-mx-5 pt-4 gap-0.5  lg:row-start-1 lg:col-start-2
    lg:col-span-1 md:flex-row md:gap-8 md:pt-3 md:pb-4 md:mt-6 md:max-lg:is-hidden:py-0
    md:max-lg:is-hidden:mt-4.5 md:max-lg:bg-home-background max-lg:is-hidden:h-0 max-lg:is-hidden:invisible
    lg:justify-end lg:items-baseline lg:mx-0 lg:mt-1.5 lg:py-0
  "/html/body/header/nav/ul": contents
  "/html/body/header/nav/ul/li[1]": text-center max-md:bg-home-background max-md:py-3
  "/html/body/header/nav/ul/li[1]/a":
    text-base no-underline after:block after:mx-auto
    after:w-10 text-foreground font-bold after:h-0.75 after:mt-0.5 after:transition-colors
    after:duration-300 hover:after:bg-foreground after:bg-foreground
  "/html/body/header/nav/ul/li[2]": text-center max-md:bg-home-background max-md:py-3
  "/html/body/header/nav/ul/li[2]/a":
