name: Install apt packages from cache
description: >-
  Installs apt packages from cached .deb files, so the Ubuntu mirror is only
  used when the runner image or the package list changes.

inputs:
  packages:
    description: Space-separated apt packages to install.
    required: true
  extra-packages-command:
    description: >-
      Shell command run after apt-get update on a cache miss; any package names
      it prints are installed too.
    required: false
    default: ""
  key:
    description: Extra cache key part, for anything that changes the package list.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The cached .debs only fit the runner image they were downloaded on.
    - name: Work out cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        EXTRA: ${{ inputs.extra-packages-command }}
        KEY: ${{ inputs.key }}
      run: |
        packages=$(printf '%s\n%s\n%s' "$PACKAGES" "$EXTRA" "$KEY" | sha256sum | cut -c1-12)
        prefix="apt-debs-${ImageOS:-unknown}-$packages-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix${ImageVersion:-unknown}-v2" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: debs
      with:
        path: ~/apt-debs
        key: ${{ steps.key.outputs.key }}
        # A new runner image starts from the last one's debs and only downloads what changed.
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Download from the Ubuntu mirror
      if: steps.debs.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        EXTRA: ${{ inputs.extra-packages-command }}
      run: |
        debs="$HOME/apt-debs"
        mkdir -p "$debs/partial"
        # A stalled mirror connection otherwise hangs until the job times out.
        apt_opts=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5)
        sudo apt-get "${apt_opts[@]}" update
        extra=""
        if [ -n "$EXTRA" ]; then extra=$(bash -c "$EXTRA"); fi
        # Drop debs left from an older image whose versions no longer match, so dpkg gets one version of each.
        # shellcheck disable=SC2086
        empty=$(mktemp -d) && mkdir "$empty/partial"
        wanted=$(sudo apt-get install -y --no-install-recommends --print-uris -o Dir::Cache::Archives="$empty" \
          $PACKAGES $extra | awk '/\.deb/ { print $2 }')
        echo "$(printf '%s\n' "$wanted" | grep -c .) packages wanted, $(find "$debs" -name '*.deb' | wc -l) debs restored"
        for f in "$debs"/*.deb; do
          [ -e "$f" ] || continue
          printf '%s\n' "$wanted" | grep -qxF "$(basename "$f")" || rm -f "$f"
        done
        # shellcheck disable=SC2086
        sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends --download-only \
          -o Dir::Cache::Archives="$debs" $PACKAGES $extra
        missing=$(printf '%s\n' "$wanted" | while read -r f; do [ -z "$f" ] || [ -e "$debs/$f" ] || echo "$f"; done | wc -l)
        echo "$missing wanted debs missing after download"
        sudo rm -rf "$debs/partial" "$debs/lock"
        sudo chown -R "$USER" "$debs"

    - name: Install
      shell: bash
      run: sudo dpkg -i "$HOME"/apt-debs/*.deb
