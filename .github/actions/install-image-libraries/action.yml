name: Install ImageMagick and libvips
description: >-
  Installs the image libraries core needs from cached .deb files, so the Ubuntu
  mirror is only used when the runner image changes.

runs:
  using: composite
  steps:
    # The cached .debs only fit the runner image they were downloaded on.
    - name: Read runner image version
      id: image
      shell: bash
      run: echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: debs
      with:
        path: ~/image-library-debs
        key: image-library-debs-${{ steps.image.outputs.version }}-v1

    - name: Download from the Ubuntu mirror
      if: steps.debs.outputs.cache-hit != 'true'
      shell: bash
      run: |
        debs="$HOME/image-library-debs"
        mkdir -p "$debs/partial"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends --download-only \
          -o Dir::Cache::Archives="$debs" imagemagick libvips42t64
        sudo rm -rf "$debs/partial" "$debs/lock"
        sudo chown -R "$USER" "$debs"

    - name: Install
      shell: bash
      run: sudo dpkg -i "$HOME"/image-library-debs/*.deb
