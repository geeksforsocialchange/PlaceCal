# Release Drafter config. Maintains a DRAFT GitHub release, continuously updated
# as PRs merge to main, with categorised notes + an auto-resolved semver bump.
# Publishing that draft is what deploys production (see test-and-deploy.yml).
#
# Categorisation + version bump are driven by PR labels. The `autolabeler` below
# only catches conventional title/branch prefixes, so most PRs are labelled by hand.
# Renovate and the extension pin PRs apply `dependencies` themselves. To force a
# specific bump, label the PR `major`/`minor`/`patch` by hand.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels: [enhancement]
  - title: "🐛 Fixes"
    labels: [fix, bug]
  - title: "🔒 Security"
    labels: [security]
  - title: "🧹 Maintenance"
    labels: [maintenance]
  - title: "📦 Dependencies"
    labels: [dependencies]
  - title: "📚 Docs"
    labels: [docs]

# Anything not matched by the categories above still shows under this heading.
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
# `internal` marks work packages merged into a feature branch first: the
# feature PR that lands them on main is the release note, not each package.
exclude-labels: [duplicate, "won't fix", internal]

version-resolver:
  major:
    labels: [breaking, major]
  minor:
    labels: [enhancement, minor]
  patch:
    labels: [fix, bug, security, maintenance, docs, dependencies, patch]
  default: patch

autolabeler:
  - label: internal
    title: ["/^WP \\d/i"]
    branch: ["/^wp\\//i"]
  - label: enhancement
    title: ["/^feat/i", "/^feature/i", "/^add/i"]
    branch: ["/^feat/i", "/^feature/i", "/^add/i"]
  - label: fix
    title: ["/^fix/i", "/^bugfix/i", "/^hotfix/i"]
    branch: ["/^fix/i", "/^hotfix/i"]
  - label: docs
    title: ["/^docs/i"]
    branch: ["/^docs/i"]
  - label: maintenance
    title:
      [
        "/^chore/i",
        "/^refactor/i",
        "/^ci/i",
        "/^test/i",
        "/^perf/i",
        "/^build/i",
      ]
    branch: ["/^chore/i", "/^refactor/i"]
  - label: dependencies
    title: ["/^upgrade/i", "/^bump/i", "/^update dependency/i"]
  - label: breaking
    title: ["/!:/", "/^break/i"]

template: |
  ## What's changed

  $CHANGES

  **Full changelog**: https://github.com/geeksforsocialchange/PlaceCal/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
