name: Flaky browser test investigation (#3341)

on:
  push:
    branches:
      - ci/flaky-investigation-*

permissions:
  contents: read

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # A: current setup. G: A with Chrome's password manager and leak detection off.
        # Both record Chrome's net-log to see the password leak checks.
        variant: [A, G]
        shard: [1, 2, 3, 4]
        exclude:
          - { variant: G, shard: 3 }
          - { variant: G, shard: 4 }

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: placecal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foobar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      PGPASSWORD: foobar
      RAILS_ENV: test
      CI: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          bundler-cache: true
          cache-version: 3

      - name: Install Imagemagick and libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libvips-dev

      - name: Install pinned Chrome for Testing
        if: matrix.variant == 'B'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # latest
        id: setup-chrome
        with:
          chrome-version: 156.0.8078.47
          install-chromedriver: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Build assets
        run: |
          bin/yarn run build:all
          bin/rails dartsass:build
          bin/rails assets:precompile

      - name: Loop the tabbed-form specs for 50 minutes
        env:
          CHROME_NO_PASSWORD_MANAGER: ${{ matrix.variant == 'G' && '1' || '' }}
        run: |
          mkdir -p results
          deadline=$(( $(date +%s) + 3000 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            netlog="$PWD/results/netlog-$i.json"
            start=$(date -u +%H:%M:%S)
            RUN_SLOW_TESTS=true CHROME_EXTRA_ARGS="--log-net-log=$netlog" bundle exec rspec spec/system/admin/tags_spec.rb spec/system/admin/partner_save_bar_spec.rb > "results/run-$i.log" 2>&1 && status=0 || status=$?
            python3 .github/scripts/leakcheck_summary.py "$netlog" > "results/leakcheck-$i.txt" 2>&1 || true
            rm -f "$netlog"
            summary=$(grep -E "^[0-9]+ examples, " "results/run-$i.log" | tail -1)
            echo "variant=${{ matrix.variant }} shard=${{ matrix.shard }} run=$i start=$start seed=0 status=$status $summary" | tee -a results/summary.txt
            grep -v " 429$" "results/leakcheck-$i.txt" | tee -a results/summary.txt
            grep -E "^rspec \./|\[input-diagnostics\]" "results/run-$i.log" | sed -E 's/"console":\[.*\],"native/"native/' | tee -a results/summary.txt || true
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-${{ matrix.variant }}-${{ matrix.shard }}
          path: |
            results/
            tmp/capybara/
          if-no-files-found: ignore
