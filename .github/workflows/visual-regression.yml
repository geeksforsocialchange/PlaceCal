name: Visual regression

# Screenshots public pages under core and every installed extension theme, in
# Chromium and WebKit, for the PR's merge base and head, and comments the diff.
# Informational: the job fails only when capture itself breaks.
on:
  pull_request:
    branches:
      - main
    paths:
      - "app/components/**"
      - "app/views/**"
      - "app/assets/**"
      - "app/tailwind/**"
      - "config/initializers/extensions.rb"
      - "Gemfile.lock"
      - "bin/visual-regression"
      - "spec/system/visual_regression_spec.rb"
      - "spec/support/visual_regression.rb"
      - ".github/workflows/visual-regression.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "Branch or ref to compare against"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foobar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      CI: true
      VR_DATABASE_URL: postgres://postgres:foobar@localhost:5432/placecal_vr

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base has to be in the clone.
          fetch-depth: 0

      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          bundler-cache: true
          cache-version: 3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browsers' system libraries come from the same .deb cache as ImageMagick and libvips.
      - name: Install Imagemagick, libvips and browser libraries
        timeout-minutes: 8
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick libvips42t64
          key: playwright-${{ steps.playwright.outputs.version }}
          extra-packages-command: >-
            yarn -s playwright install-deps --dry-run chromium webkit
            | awk '/^Missing system dependencies/ { found = 1; sub(/^[^:]*:/, "") } found'
            | tr -s ' ' '\n' | grep -E '^[a-z0-9][a-z0-9.+-]+$' || true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        timeout-minutes: 8
        run: yarn playwright install chromium webkit

      - name: Capture and compare
        run: bin/visual-regression --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref || inputs.base }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression
          path: tmp/visual_regression/
          if-no-files-found: ignore
          retention-days: 14

      - name: Add summary to the job page
        if: always()
        run: |
          if [ -f tmp/visual_regression/summary.md ]; then
            cat tmp/visual_regression/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Pull requests from forks get a read-only token, so they can't comment.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && hashFiles('tmp/visual_regression/summary.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=tmp/visual_regression/comment.md
          cp tmp/visual_regression/summary.md "$body"
          printf '\n[Workflow run and artifact](%s)\n' "$RUN_URL" >> "$body"
          marker='<!-- visual-regression-summary -->'
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" > /dev/null
          fi
