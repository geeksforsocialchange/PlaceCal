name: Dependency health

# Flags stale, archived or vulnerable gems in the Security tab; never blocks a PR.
on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  still-active:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0

      - uses: SeanLF/still_active-action@03e85060785c8769c7e71de7a592719bf41813ea # v0.5.0
        with:
          github-token: ${{ github.token }}
          sarif: still_active.sarif.json

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always()
        with:
          sarif_file: still_active.sarif.json
