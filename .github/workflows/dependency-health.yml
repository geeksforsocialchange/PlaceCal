name: Dependency health

# Flags stale, archived or vulnerable gems in the Security tab; never blocks a PR.
on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  still-active:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0

      - uses: SeanLF/still_active-action@03e85060785c8769c7e71de7a592719bf41813ea # v0.5.0
        with:
          github-token: ${{ github.token }}
          sarif: still_active.sarif.json

      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: always()
        with:
          sarif_file: still_active.sarif.json
