name: Dependency health

# Flags stale, archived or vulnerable gems in the Security tab; never blocks a PR.
on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  still-active:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0

      - uses: SeanLF/still_active-action@03e85060785c8769c7e71de7a592719bf41813ea # v0.5.0
        with:
          github-token: ${{ github.token }}
          sarif: still_active.sarif.json

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: still_active.sarif.json
