name: Discord release notification

# Posts a branded embed to Discord when a release is published, instead of the
# default GitHub -> Discord webhook that dumps the raw release body (including
# the long renovate maintenance list). Can also be run manually to re-announce
# a release (or to test the embed) via the "Run workflow" button.
#
# Enable by:
#   1. Add the DISCORD_RELEASE_WEBHOOK repo secret (the Discord webhook URL,
#      WITHOUT the trailing "/github" that the GitHub integration uses).
#   2. Remove the old "release" repo webhook (Settings -> Webhooks) so releases
#      aren't announced twice.
# Until the secret is set the job runs but no-ops.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (blank = latest published release)"
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post release embed to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 <<'PY'
          import json, os, re, urllib.request

          webhook = os.environ.get("WEBHOOK", "").strip()
          if not webhook:
              print("DISCORD_RELEASE_WEBHOOK not set; skipping.")
              raise SystemExit(0)

          def api_release():
              # Manual run: pull the release from the API (given tag, else latest).
              repo = os.environ["REPO"]
              tag = (os.environ.get("INPUT_TAG") or "").strip()
              path = f"tags/{tag}" if tag else "latest"
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "placecal-release-bot",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          if os.environ.get("EVENT_NAME") == "release":
              body = os.environ.get("RELEASE_BODY", "") or ""
              tag = os.environ.get("RELEASE_TAG", "") or ""
              name = (os.environ.get("RELEASE_NAME", "") or tag or "New release").strip()
              url = os.environ.get("RELEASE_URL", "") or ""
          else:
              rel = api_release()
              body = rel.get("body") or ""
              tag = rel.get("tag_name") or ""
              name = (rel.get("name") or tag or "New release").strip()
              url = rel.get("html_url") or ""

          # Collapse the noisy "Maintenance" section (renovate dependency bumps)
          # into a single count so the human-facing changes stay front and centre.
          parts = re.split(r"(?m)^(## .*)$", body)
          rebuilt = [parts[0]]
          for header, content in zip(parts[1::2], parts[2::2]):
              bullets = sum(1 for ln in content.splitlines() if ln.lstrip().startswith("- "))
              if bullets == 0:
                  continue  # drop empty template sections (e.g. "What's changed")
              if "Maintenance" in header:
                  noun = "update" if bullets == 1 else "updates"
                  rebuilt.append(header)
                  rebuilt.append(f"\n- {bullets} dependency & maintenance {noun}\n\n")
              else:
                  rebuilt.append(header)
                  rebuilt.append(content)
          description = "".join(rebuilt).strip()

          # Discord caps embed descriptions at 4096 chars.
          limit = 3900
          if len(description) > limit:
              description = description[:limit].rstrip() + "\n\n…"

          embed = {
              "title": name,
              "url": url,
              "description": description,
              "color": 0xAFCF5A,  # PlaceCal brand green
              "footer": {"text": "PlaceCal release"},
          }
          payload = {"username": "PlaceCal", "embeds": [embed]}

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print(f"Discord responded {resp.status}")
          PY
