    home:
      title: Run PlaceCal in your community
      description: PlaceCal is a not-for-profit, co-owned calendar platform for neighbourhoods. Set it up in your community.
      hero:
        kicker: A calendar co-op for your community
        title: Set up PlaceCal in your community.
        intro: PlaceCal is a not-for-profit, co-owned calendar platform for neighbourhoods. We help councils, housing associations, community organisations, and cultural venues build one shared system for everything happening near them.
        cta_demo: Book a demo
        cta_how: How it works
      stats:
        partnerships: Partnerships live
        partners: Community partners
        events: Events this month
        residents: Residents spoken to
        residents_value: 6,000+
      audiences:
        kicker: Who it's for
        heading: PlaceCal works differently for different people.
        lede: Pick the one that describes you. Each has its own pitch, case study, and next step.
      why:
        kicker: Why PlaceCal
        heading: Three big problems. One shared fix.
        intro: "We spent years talking to over 6,000 people in Manchester about why community information was so hard to find. The answers were always the same:"
        problems:
          - Every institution builds their own directory, and none of them stay up to date
          - Community groups don't have time to maintain six different listings
          - Nobody trains anyone how to do any of this
        cta: Read our story
        quote: "“PlaceCal lets us focus on organising collaborative festivals across venues, rather than struggling to find out what's on.”"
        quote_by: Community partnership coordinator, Hulme
      features:
        kicker: What you get
        heading: Everything a hyperlocal calendar needs.
        see_all: See all features
      cta:
        heading: Let's talk about your community.
        body: A 30-minute call, no pitch deck. We listen, learn what you're trying to do, and tell you honestly whether PlaceCal is the right fit.
        button: Book a 30-min chat
    audiences:
      index:
        title: Who PlaceCal is for.
        lede: We work with six kinds of organisation. Each has its own story, so pick yours.
      see_pitch: See the pitch
      for_kicker: For %{audience}
      how_heading: How it works for you
      impact_heading: Proof & impact
      others:
        kicker: How PlaceCal helps other groups
        heading: You might also be interested in
      cta_demo: Book a demo
      cta_features: See features
      community_groups:
        title: Community groups
        lede: Turn your local knowledge into a community information website.
        image_alt: A middle aged woman and young girl enjoying a pottery class
        hero: We help community groups build something bigger than themselves.
        subhero: You know everything about your neighbourhood. We give you the tools to share it, without adding work to overstretched volunteers.
        details: We know first hand that community partnerships are often cash strapped and time poor, but are often delivering the most important and life-changing support to the most vulnerable in society. The PlaceCal process helps make the most of the little time you have, and works with what community groups are already using, in some cases requiring no additional effort.
        impact:
          - title: 200+ events a week
            body: Residents in Hulme have access to a constantly updated, high quality and trusted community resource with access to dozens of groups and over 200 events a week. The city council and housing associations struggle to even publish 10.
          - title: Festivals made easy
            body: Community partnerships, social prescribers and neighbourhood teams in our pilot areas have been able to collaborate quickly and easily, enabling an unprecedented level of coordination, from finding out what's on to putting on festivals together.
      metropolitan_areas:
        title: Metropolitan areas & councils
        lede: Publish what's on guides across health, housing, and council sectors.
        image_alt: An aerial view of a city centre
        hero: One calendar for everything going on in your city.
        subhero: Stop paying three agencies to build three directories that never stay up to date. PlaceCal gives you one shared system across health, housing, culture and community.
        details: Councils across Greater Manchester and beyond are using PlaceCal to replace fragmented asset maps, brittle event directories and paper leaflets with one living system, co-owned by residents, VCSEs, libraries and council staff alike.
        impact:
          - title: Manchester City Council
            body: Age Friendly Manchester uses PlaceCal as its primary activity finder for residents aged 50+. 94 partners, 212 events per month, curated alongside the council team.
          - title: Tameside MBC
            body: Tameside uses PlaceCal borough-wide, with neighbourhood teams in Ashton, Stalybridge, Hyde and Mossley curating their own views of the same shared data.
      housing_providers:
        title: Housing providers
        lede: Connect your tenants with their local community.
        image_alt: "A row of brightly coloured timber houses: blue, green, grey, yellow and red"
        hero: Tenant engagement that starts with what's actually happening nearby.
        subhero: A PlaceCal branded for your housing association, auto-populated with the community events near each of your properties. Residents see what's on a short walk from their front door.
        details: We work with housing providers to give residents a curated, hyperlocal calendar of activities, from coffee mornings and warm spaces to job clubs and support groups, all running inside existing community infrastructure you already fund.
        impact:
          - title: Targeted to postcode
            body: Residents in each estate see activities within a 15-minute walk, automatically surfaced based on the postcode they live at.
          - title: Works with existing partners
            body: We help your community investment team map which local groups are running activities for your tenants and bring them into one shared system.
      social_prescribers:
        title: Social prescribers & GPs
        lede: Find hyperlocal social prescriptions in under 30 seconds.
        image_alt: A GP talking with a patient
        hero: A social prescribing tool that doesn't waste the patient's afternoon.
        subhero: Filter by interest, day of the week and walking distance from the practice. Print a referral sheet in one click.
        details: PlaceCal is used by link workers and GPs across Greater Manchester to find the right group for the patient in front of them, without relying on out-of-date PDFs or asking the receptionist.
        impact:
          - title: Under 30 seconds per referral
            body: Search by interest, filter by day and distance, print or email the referral. No accounts, no passwords, no third-party software.
          - title: Always up to date
            body: "Community groups maintain their own listings using tools they already use: Google Calendar, Outlook, Facebook. You always see the current version."
      vcses:
        title: VCSEs
        lede: Support community groups in your neighbourhood to work better together.
        image_alt: Four laughing volunteers in matching event t-shirts sitting outdoors, throwing colourful paper shapes
        hero: Infrastructure for the infrastructure organisation.
        subhero: If your job is to enable the community groups in your area, PlaceCal is the shared system they've been waiting for.
        details: Voluntary, community and social enterprise organisations can set up PlaceCal for their patch, giving every member group a free, maintained listing and the training to keep it updated.
        impact:
          - title: One training programme
            body: We deliver the training so your team doesn't have to become calendar software experts.
          - title: Shared infrastructure
            body: Member groups are already using Google, Outlook, or Facebook. We plug into what they've got.
      culture_tourism:
        title: Culture & tourism
        lede: Bring more people into your venue, your area or your city.
        image_alt: A crowd at a music venue
        hero: Every venue in the area, on one calendar. Yes, even that one.
        subhero: Cultural districts, festival cities and tourism boards use PlaceCal to surface the full programme, from main-stage gigs to the poetry night in the pub.
        details: Whether you're running a cultural quarter, a BID, or a destination marketing organisation, PlaceCal gives you a curated calendar that includes the grassroots programming usually invisible to official listings.
        impact:
          - title: Festival mode
            body: Pop up a curated view for a festival weekend, then fold it back into the full calendar when it's done.
          - title: Multi-venue views
            body: Visitors see the whole cultural offer, not just the venues that pay for listings.
    features:
      title: Everything PlaceCal does.
      lede: What PlaceCal does today, and the features we're planning.
      groups:
        - key: calendars
          title: Works with the calendars you already use
          summary: Groups keep using the tools they already have. PlaceCal reads their calendars and keeps every listing up to date.
          link: handbook
          link_label: See every supported calendar source
          items:
            - title: Calendar apps
              icon: calendar
              brands: [googlecalendar, microsoftoutlook, teamup]
              body: Google Calendar, Outlook and Microsoft 365, Teamup, and any calendar that publishes an iCal feed.
            - title: Ticketing and event sites
              icon: ticket
              brands:
                [
                  eventbrite,
                  meetup,
                  tickettailor,
                  ticketsource,
                  ticketsolve,
                  outsavvy,
                ]
              body: Eventbrite, Meetup, Ticket Tailor, TicketSource, Ticketsolve, OutSavvy and Resident Advisor.
            - title: Website builders
              icon: desktop
              brands: [wordpress, squarespace, wix]
              body: Event pages on WordPress, Squarespace and Wix, and any website that publishes its events as schema.org JSON-LD.
            - title: Online events
              icon: video
              brands: [zoom, microsoftteams, googlemeet, jitsi]
              body: Online events on sites like Zoom, Microsoft Teams, Google Meet and Jitsi are picked up automatically.
        - key: neighbourhoods
          title: Built for neighbourhoods
          summary: Every PlaceCal is local, curated by the people who know the area.
          link: directory
          link_label: Browse the nationwide directory
          items:
            - title: Your own local site
              icon: map_pin
              body: Every partnership runs its own site with curated partners, events and neighbourhoods.
            - title: Maps and neighbourhoods
              icon: map
              body: Every partner on a map, and events and partners filtered by neighbourhood.
            - title: One partner, multiple sites
              icon: link
              body: Partners just need to list once and their info can be reused by everyone.
            - title: Nationwide directory
              icon: globe
              body: Everything shows up in our national listings so everyone can find you.
        - key: accessibility
          title: Accessible to everyone
          summary: Built so everyone in a neighbourhood can use it, whatever device or assistive technology they use.
          link: accessibility
          link_label: Read our accessibility statement
          items:
            - title: WCAG 2.2 AA
              icon: check_circle
              body: Public pages and the admin area meet WCAG 2.2 at level AA, checked automatically on every change and by hand in the browser.
            - title: Keyboard and screen reader friendly
              icon: keyboard
              body: Skip links, visible focus, filters that announce their results, and pages that reflow at 400% zoom.
            - title: Venue access information
              icon: accessibility
              body: Groups can describe step-free access, toilets, transport and quiet spaces, so people know before they go.
        - key: sustainability
          title: Light on the planet
          summary: We measure PlaceCal's carbon footprint and publish how we worked it out.
          link: sustainability
          link_label: Our climate impact assessment
          items:
            - title: Green hosting
              icon: leaf
              body: Our hosting and network providers say they power their operations with 100% renewable electricity.
            - title: A fraction of the data
              icon: feather
              body: On a first visit, finding an event on PlaceCal uses under a quarter of the data Eventbrite does, and under a tenth of Facebook's.
            - title: Measured and published
              icon: chart_column
              body: Our figures, method and measuring script are public, and we update them when things change.
        - key: open_data
          title: Open data, ready for AI
          summary: Your listings reach people wherever they look, from search engines to AI assistants.
          link: mcp
          link_label: Use PlaceCal with an AI assistant
          items:
            - title: Ask an AI assistant
              icon: chat
              brands: [openai, claude, googlegemini, microsoftcopilot]
              body: Connect PlaceCal's free MCP server to ChatGPT, Claude, Gemini or Copilot and ask what's on nearby.
            - title: Found by search engines
              icon: search
              body: Every event and partner page carries schema.org JSON-LD, so search engines can show times and places.
            - title: Calendar feeds
              icon: rss
              body: Every site and every partner has a calendar feed people can subscribe to in their own calendar app.
            - title: An API for your own apps
              icon: code
              body: A GraphQL API shaped around schema.org, included in the Organisation and Institution plans.
        - key: community
          title: Owned by the community
          summary: PlaceCal is run for the neighbourhoods that use it, not for advertisers.
          link: source_code
          link_label: See the code on GitHub
          items:
            - title: Collective ownership
              icon: users
              body: Not-for-profit, co-operative, and co-owned by the partnerships who use it.
            - title: Open source
              icon: git_branch
              body: PlaceCal's code is free and open under the AGPL licence, so it can't be locked away.
            - title: No ads, no algorithm
              icon: eye_off
              body: Nobody pays to be seen, and no algorithm decides which events people see.
            - title: Training for organisers
              icon: book
              body: We train the people who run your PlaceCal and the groups who publish to it, so everyone can keep listings up to date.
      planned:
        kicker: Planned
        title: Planned features
        lede: These features are planned and not available yet.
        link_label: Follow our work on GitHub
        items:
          - title: Welsh-language sites
            icon: languages
            body: Sites that work fully in Welsh, or in Welsh and English side by side.
          - title: Monthly impact reports
            icon: clipboard
            body: A report each month on your site's partners, events and visits, ready to use in your own reporting.
          - title: Alerts when listings go quiet
            icon: bell
            body: See which calendars have stopped updating, and hear about them before residents notice.
          - title: Export everything
            icon: download
            body: Download all of your site's partners, calendars and events whenever you like, so you're never locked in.
          - title: Events on your own website
            icon: app_window
            body: A snippet that shows your PlaceCal events inside the website you already have.
          - title: Large-print weekly sheets
            icon: printer
            body: A printable, large-print sheet of the week's events for noticeboards.
          - title: Data protection and security pack
            icon: shield
            body: A ready-made DPIA template, data processing agreement and security statement for your IT team.
          - title: Perfect Lighthouse scores
            icon: lightning
            body: 100 for performance, accessibility, best practices and SEO across our public pages.
    # Shared by the audience-page aside and the pricing-page timeline.
    rollout:
      heading: A four-step rollout
      steps:
        - title: Discovery call
          body: A chat on the phone to get the ball rolling.
        - title: Map your partners
          body: We help you enter everything you already know.
        - title: Import the events
          body: We convert what you have into calendar feeds.
        - title: Launch & train
          body: You have tools and ongoing support.
    # Our story is served by the directory's page (Views::Directory::OurStory,
    # copy under directory.pages.our_story), so there is no join-specific copy.
    pricing:
      title: Plans and pricing
      description: PlaceCal plans for community groups, VCSE organisations and institutions. Priced by who you are, and free forever for grassroots groups.
      eyebrow: Pricing
      per_month: /mo
      from: from
      table:
        caption: PlaceCal pricing tiers compared by feature
        included: Included
        not_included: Not included
        support_heading: Support
      tiers:
        community:
          name: Community
          who: Community groups with a bit of funding
          who_card: Community groups that have secured a bit of funding.
          price: £20
          setup: + £750 one-off setup
          setup_card: + £750 one-off setup
          spec_strong: Up to 50
          spec_rest: " groups"
          bullets:
            - Your own branded site, built with you
            - Handbook, Discord and drop-in support
        organisation:
          name: Organisation
          who: VCSE organisations with paid staff
          who_card: VCSE organisations with full-time paid staff.
          price: £50
          setup: + £2,500 one-off setup
          setup_card: + £2,500 one-off setup
          spec_strong: Up to 200
          spec_rest: " groups"
          bullets:
            - Everything in Community
            - Custom domain and API access
            - Email support
        institution:
          name: Institution
          who: Councils, NHS, universities, housing
          who_card: Councils, the NHS, universities, housing associations.
          from: true
          price: £500
          setup: + £7,500 one-off setup
          setup_card: + £7,500 setup, quoted
          spec_strong: Any size
          spec_rest: ", no cap"
          bullets:
            - Everything in Organisation
            - Reporting and support guarantees
            - Monthly 1:1 check-in
      rows:
        - label: Groups you can list
          values: ["Up to 50", "Up to 200", "Any size, no cap"]
        - label: Admin logins
          values: ["1-2", "Up to 5", "Unlimited"]
        - label: Example use case
          values:
            [
              "Local community of interest",
              "City-wide support group listing",
              "Regional events directory",
            ]
        - label: Custom domain
          values: [false, true, true]
        - label: API access
          values: [false, true, true]
      support_rows:
        - label: Monthly drop-ins
          values: [true, true, true]
        - label: Organiser handbook
          values: [true, true, true]
        - label: Discord community
          values: [true, true, true]
        - label: Email support
          values: [false, true, true]
        - label: Monthly 1:1 check-in
          values: [false, false, true]
        - label: Reporting and support guarantees
          values: [false, false, true]
      starter:
        name: Starter
        price: Free, forever
        body:
          - For grassroots groups with no paid staff and no funding yet. You curate a partnership of up to 20 groups on an existing PlaceCal site, supported at the monthly drop-ins, with the handbook and Discord community.
          - When you're ready, we help you cost PlaceCal into a funding bid, including paying for your own time.
      cta: Get in touch
      extras:
        heading: Extras
        poa: POA
        poa_note: Price on application
        addons:
          - title: Extra sites
            body: Running more than one neighbourhood or theme? Add another branded PlaceCal site alongside your main one.
          - title: Bespoke hands-on support
            body: "Support beyond your tier: hands-on onboarding where we map your partners and import their events, or a dedicated block of our time."
          - title: Custom sites and development
            body: Bespoke design, a build that goes beyond the standard site, or a feature you need for your programme. We scope it and price it per piece of work.
          - title: Translation into other languages
            body: We'd love to help set up PlaceCal in other countries, and we can do the translation for you.
        training:
          title: Organiser training course
          body: Three sessions for the people who'll run your PlaceCal day to day. Pay what you can, standard rate £1,800.
          rows:
            - label: Project-funded
              amount: £600
            - label: Core-funded
              amount: £1,200
            - label: Institutions
              amount: £2,400
            - label: Standard rate
              amount: £1,800
              standard: true
      faq:
        heading: Questions
        items:
          - question: How does billing work?
            answer: Billing is annual by invoice by default, with a 10% discount. Monthly payment by card is also available.
          - question: I want to list several groups. Does that cost more?
            answer: Your monthly service is priced by who you are, not by how many groups you list. Each tier has an approximate group guideline; it's not a hard limit, so if you're close to it, just talk to us.
          - question: What counts as an Institution?
            answer: The promises test, not size. If you need reporting, support guarantees and things in writing, you're an Institution. A big VCSE organisation happy without them stays at £50.
          - question: What if the fee is a barrier?
            answer: Money should never be the reason your community can't use PlaceCal. If the fee is a barrier, talk to us.
    demo:
      title: Book a 30-minute chat.
      lede: No pitch deck. We listen, learn what you're trying to do, and tell you honestly whether PlaceCal is the right fit.
      flash:
        success: Thanks, we've got your message and we'll be in touch to pick a time.
        error: Sorry, we couldn't send that. Please check the form below and try again.
