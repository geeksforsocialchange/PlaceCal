# No database key, so the cache table lives in the primary database.
default: &default
  store_options: &store_options
    max_age: <%= 1.week.to_i %>
    max_size: <%= 256.megabytes %>

development:
  <<: *default

test:
  store_options:
    <<: *store_options
    # The expiry thread shares the connection transactional fixtures pin, and can deadlock with them.
    expiry_method: :job

staging:
  <<: *default

production:
  <<: *default
