default: &default
  adapter: postgresql
  # Solid Queue's threads (worker, dispatcher, scheduler, heartbeats) each hold a connection in the job worker
  pool: <%= ENV.fetch('DB_POOL', 10) %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV['POSTGRES_DB'] || 'placecal_dev' %>
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV['PGPASSWORD'] %>
  host: <%= ENV['POSTGRES_HOST'] || 'localhost' %>
  port: <%= ENV['POSTGRES_PORT'] || 5432 %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: placecal_test
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV['PGPASSWORD'] %>
  host: <%= ENV['POSTGRES_HOST'] || 'localhost' %>
  port: <%= ENV['POSTGRES_PORT'] || 5432 %>

staging:
  <<: *default
  database: <%= ENV['POSTGRES_DB'] || 'placecal_staging' %>
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV['PGPASSWORD'] %>
  host: <%= ENV['POSTGRES_HOST'] || 'localhost' %>
  port: <%= ENV['POSTGRES_PORT'] || 5432 %>

production:
  <<: *default
  database: <%= ENV['POSTGRES_DB'] || 'placecal_production' %>
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV['PGPASSWORD'] %>
  host: <%= ENV['POSTGRES_HOST'] || 'localhost' %>
  port: <%= ENV['POSTGRES_PORT'] || 5432 %>
