# Production destination overrides
# Usage: kamal deploy -d production
#
# Set PRODUCTION_HOST in your environment or .kamal/secrets.production
<% begin; require "dotenv"; Dotenv.load(".kamal/secrets.production"); rescue LoadError; end %>

servers:
  web:
    hosts:
      - <%= ENV["PRODUCTION_HOST"] %>
  job_worker:
    hosts:
      - <%= ENV["PRODUCTION_HOST"] %>

# Cloudflare handles routing/SSL. List every hostname served by this app.
# The app reads this list too: a site's domain is served by PlaceCal only once it is here (PlaceCal::ServedHosts).
proxy:
  hosts:
    - placecal.org
    - "*.placecal.org"
    - www.queerleeds.lgbt
    # The Trans Dimension, served by its extension theme
    - transdimension.uk
    - www.transdimension.uk

accessories:
  db:
    host: <%= ENV["PRODUCTION_HOST"] %>
